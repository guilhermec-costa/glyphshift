# Sparse ink shading; outline characters preserve small dark silhouettes.
enabled=true
render_style=illustrated
cell_width=6
cell_height=10
color_mode=mono
glyph_strength=1
character_set=custom
characters="      .:-=+*#@█"
shape_characters="/\\|_()<>^v`',.-LJ7[]T"
glyph_order=manual
glyph_reverse=true
shape_matching=true
shape_threshold=0.45
scene_paper=0
tone_exposure=1.05
tone_contrast=1.15
tone_gamma=1
edge_strength=0.55
edge_threshold=0.45
fill_enabled=true
contour_overlay=true
foreground=0.04,0.06,0.1
background=0.94,0.92,0.85
glow=0.15
stability=0.8
crisp_glyphs=true
