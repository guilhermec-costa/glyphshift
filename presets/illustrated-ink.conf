# Dark text and contour strokes on warm paper; reverse weighted fill for ink shading.
enabled=true
render_style=illustrated
cell_width=8
cell_height=12
color_mode=mono
glyph_strength=1
character_set=custom
characters="    .:-=+*#@█"
glyph_order=manual
glyph_reverse=true
tone_exposure=1.05
tone_contrast=1.15
tone_gamma=1
edge_strength=1
edge_threshold=0.22
fill_enabled=true
contour_overlay=true
foreground=0.04,0.06,0.1
background=0.94,0.92,0.85
