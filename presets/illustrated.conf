# Scene-colored ink drawing on a watercolor paper wash: dark ink takes each
# cell's hue, outline characters draw silhouettes, and paper blends smoothly.
enabled=true
render_style=illustrated
cell_width=6
cell_height=10
color_mode=source
glyph_strength=1
character_set=custom
characters="   .:-=+*#%@"
glyph_order=manual
glyph_reverse=true
shape_characters="/\\|_()<>^v`',.-LJ7[]T"
shape_matching=true
shape_threshold=0.3
scene_paper=0.35
paper_wash=true
saturation=1.6
glow=0.25
tone_exposure=1.05
tone_contrast=1.3
tone_gamma=1
edge_strength=0.6
edge_threshold=0.45
fill_enabled=true
contour_overlay=true
foreground=0.18,0.18,0.18
background=0.97,0.95,0.9
