# A full glyph drawing: bright ink carries color, contours carry shape.
enabled=true
render_style=illustrated
cell_width=8
cell_height=12
color_mode=source
glyph_strength=1
character_set=custom
characters=" .:-=+*#@████"
glyph_order=manual
tone_exposure=1
tone_contrast=1
tone_gamma=1
edge_strength=1
