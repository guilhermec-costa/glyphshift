# Character shading with local silhouette matching; no per-pixel scene blend.
enabled=true
render_style=illustrated
cell_width=6
cell_height=10
color_mode=source
glyph_strength=1
character_set=custom
characters="       .:-=+*#@█▘▝▀▖▌▞▛▗▚▐▜▄▙▟"
glyph_order=manual
shape_matching=true
shape_threshold=0.35
scene_paper=0.95
tone_exposure=0.9
tone_contrast=1
tone_gamma=1
edge_strength=0.55
edge_threshold=0.3
fill_enabled=true
contour_overlay=true
foreground=0.92,0.97,1
background=0.015,0.025,0.045
