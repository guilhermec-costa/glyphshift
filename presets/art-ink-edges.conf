# Ink & Edges: crisp white letters and DoG line art on black. Automatic
# exposure lifts dark games and tones bright ones down. Contours replace the fill.
enabled=true
render_style=illustrated
cell_width=6
cell_height=8
color_mode=mono
glyph_strength=1
character_set=custom
characters="   .:coPO?@█"
glyph_order=manual
glyph_reverse=false
shape_matching=false
crisp_glyphs=true
stability=0.8
tone_exposure=1.2
auto_exposure=1
tone_contrast=0.8
tone_gamma=0.9
edge_strength=1
edge_threshold=0.35
edge_detector=dog
dog_sigma=1.1
dog_threshold=0.025
edge_votes=0.25
fill_enabled=true
contour_overlay=false
foreground=0.95,0.95,0.92
background=0,0,0
